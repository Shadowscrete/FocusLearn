$kind: http-request
method: DELETE
url: '{{base_url}}/api/users/:id'
order: 5000
pathVariables:
  - key: id
    value: '{{userId}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status code is 204", function () {
          pm.response.to.have.status(204);
      });